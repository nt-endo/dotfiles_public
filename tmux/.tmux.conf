set -g prefix C-z
unbind C-b
bind C-z send-prefix
bind BSpace previous-window

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g focus-events on

set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-style "fg=colour255,bg=colour238"
set-option -g status-left-length 30
set-option -g status-left "#[fg=colour255,bg=colour241] #S #[default]"
set-option -g status-right-length 40
set-option -g status-right "#[fg=colour255,bg=colour241] %m/%d %H:%M #[default]"
set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-style "fg=colour255,bg=colour27,bold"
set-window-option -g window-status-current-format " #I: #W#{?window_zoomed_flag, [Z],} "
